name: local_delivery_customer
description: Local Delivery Customer App - Browse stores, shop grocery products, and track your deliveries.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Shared UI package
  local_delivery_ui:
    path: ../local_delivery_ui

  # Routing
  go_router: ^14.2.3

  # State Management
  flutter_bloc: ^8.1.6

  # Dependency Injection
  get_it: ^7.6.0

  # Backend
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Utils
  equatable: ^2.0.5
  dartz: ^0.10.1
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.2
  image_picker: ^1.1.2
  flutter_dotenv: ^5.2.1
  geolocator: ^13.0.4
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/

# ── App Icon Configuration ─────────────────────────────────────────────────
# Run `dart run flutter_launcher_icons` after editing this block.
flutter_launcher_icons:
  # Android — generates both legacy (mipmap) and adaptive icon (API 26+)
  android: true
  # iOS — generates all required icon sizes
  ios: true

  # Source image (PNG, ideally 1024×1024)
  image_path: "assets/brand_logo.png"

  # Android adaptive icon: brand green background + logo as foreground layer.
  # The foreground should have ~25 % safe-zone padding so it doesn't get
  # clipped on rounded/circle launchers.
  adaptive_icon_background: "#1D5C38"
  adaptive_icon_foreground: "assets/brand_logo.png"

  # iOS: strip alpha channel (iOS icons must be fully opaque)
  remove_alpha_ios: true

  # Minimum Android SDK (21 = Android 5.0 Lollipop)
  min_sdk_android: 21
