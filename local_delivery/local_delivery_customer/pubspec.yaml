name: local_delivery_customer
description: Local Delivery Customer App - Browse stores, shop grocery products, and track your deliveries.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Shared UI package
  local_delivery_ui:
    path: ../local_delivery_ui

  # Routing
  go_router: ^14.2.3

  # State Management
  flutter_bloc: ^8.1.6

  # Dependency Injection
  get_it: ^7.6.0

  # Backend
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Utils
  equatable: ^2.0.5
  dartz: ^0.10.1
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.2
  image_picker: ^1.1.2
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
